<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} · {{site_title}}</title>
<meta name="description" content="{{site_description}}">
<link rel="stylesheet" href="{{base}}assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{base}}index.html">{{site_title}}</a>
  <div class="topbar-right">
    <input id="searchInput" class="search" type="search" placeholder="搜索文档… (Ctrl+K)" aria-label="搜索文档">
    <a class="topbar-link" href="{{github}}" target="_blank" rel="noopener">GitHub</a>
    <button id="themeToggle" class="icon-btn" title="切换亮/暗主题">🌓</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">文档目录</div>
    {{sidebar}}
  </aside>
  <main class="content">
    <article class="doc">
      <h1 class="doc-title">{{title}}</h1>
      {{content}}
    </article>
    {{prevnext}}
  </main>
  <aside class="toc">
    {{toc}}
  </aside>
</div>
<footer class="site-footer">© <span>{{year}}</span> {{site_title}} · 基于静态站点生成</footer>
<script src="{{base}}assets/app.js"></script>
</body>
</html>
